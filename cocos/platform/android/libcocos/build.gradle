apply plugin: 'com.android.library'

android {
    namespace = 'org.cocos.lib'
    compileSdk = PROP_COMPILE_SDK_VERSION.toInteger()
    def buildTools = project.providers.gradleProperty('PROP_BUILD_TOOLS_VERSION').orNull
    if (buildTools != null) {
        buildToolsVersion = buildTools
    }

    buildFeatures { buildConfig = true }

    defaultConfig {
        buildConfigField 'boolean', 'HAPTICS_ENVELOPE_BUILT', (PROP_COMPILE_SDK_VERSION.toInteger() >= 36).toString()
        minSdk = PROP_MIN_SDK_VERSION.toInteger()
        consumerProguardFiles '../java/file-dialog.pro', '../java/text-input.pro'
        consumerProguardFiles '../java/gamepads.pro'
        consumerProguardFiles '../java/system-info.pro'
        consumerProguardFiles '../java/haptics.pro'
        versionCode 1
        versionName "1.0"
    }

    sourceSets.main {
        aidl.srcDir "../java/src"
        java.srcDir "../java/src"
        if (PROP_COMPILE_SDK_VERSION.toInteger() >= 36) {
            java.srcDir "../java/src-api36"
        }
        manifest.srcFile "AndroidManifest.xml"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', '../java/text-input.pro', '../java/gamepads.pro'
            proguardFiles '../java/system-info.pro'
            proguardFiles '../java/haptics.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: '../java/libs', include: ['*.jar'])
}
